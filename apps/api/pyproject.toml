[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "universal-ai-search-backend"
version = "0.1.0"
description = "API and worker processes for Universal AI Search."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<47",
  "defusedxml>=0.7,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pypdf>=6.15,<7",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=6.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "black>=25.1,<26",
  "mypy>=1.16,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-defusedxml>=0.7,<1",
]

[project.scripts]
universal-ai-search-worker = "universal_ai_search.worker.main:run"
universal-ai-search-schema = "universal_ai_search.database.schema:run"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_ai_search"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=universal_ai_search --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# SQL persistence is exercised against PostgreSQL by tests_database; the unit
# coverage gate measures the application/security logic around that adapter.
omit = [
  "*/universal_ai_search/auth/store.py",
  "*/universal_ai_search/connections/store.py",
  "*/universal_ai_search/sync/drive_repository.py",
  "*/universal_ai_search/indexing/repository.py",
  "*/universal_ai_search/search/repository.py",
  "*/universal_ai_search/sync/repository.py",
]
