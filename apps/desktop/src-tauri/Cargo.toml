[package]
name = "universal-ai-search-desktop"
version = "0.1.0"
description = "Read-only local file connector for Universal AI Search"
authors = ["Universal AI Search maintainers"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "universal_ai_search_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
