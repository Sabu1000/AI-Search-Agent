[package]
name = "uas-desktop-scanner"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[target.'cfg(unix)'.dependencies]
cap-fs-ext = "4.0"
cap-std = "4.0"
ignore = "0.4"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
