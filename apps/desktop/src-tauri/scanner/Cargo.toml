[package]
name = "uas-desktop-scanner"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[features]
default = ["persistent-manifest"]
persistent-manifest = ["dep:rusqlite"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
getrandom = "0.3"
sha2 = "0.10"
time = { version = "0.3.55", features = ["parsing"] }
uuid = "1.24"
zeroize = "1.8"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"], optional = true }

[target.'cfg(unix)'.dependencies]
cap-fs-ext = "4.0"
cap-std = "4.0"
ignore = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
serde_json = "1"
