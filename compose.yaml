name: universal-ai-search

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: ${POSTGRES_DB:-uas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/$${UAS_OBJECT_STORAGE_BUCKET}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local}
      UAS_OBJECT_STORAGE_BUCKET: ${UAS_OBJECT_STORAGE_BUCKET:-universal-ai-search-local}
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: ["universal-ai-search-schema"]
    environment:
      UAS_DATABASE_MIGRATION_URL: ${UAS_DATABASE_MIGRATION_URL:-postgresql+psycopg://uas:change-me-local@postgres:5432/uas}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      UAS_ENVIRONMENT: ${UAS_ENVIRONMENT:-local}
      UAS_DATABASE_URL: ${UAS_DATABASE_URL:-postgresql+asyncpg://uas:change-me-local@postgres:5432/uas}
      UAS_DATABASE_ROLE: ${UAS_DATABASE_ROLE:-app_api}
      UAS_REDIS_URL: ${UAS_REDIS_URL:-redis://redis:6379/0}
      UAS_OBJECT_STORAGE_ENDPOINT: ${UAS_OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      UAS_OBJECT_STORAGE_BUCKET: ${UAS_OBJECT_STORAGE_BUCKET:-universal-ai-search-local}
      UAS_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      UAS_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-local}
      UAS_CURSOR_SIGNING_KEY: ${UAS_CURSOR_SIGNING_KEY:-change-me-local-cursor-signing-key-32-bytes}
      UAS_IDEMPOTENCY_HASH_KEY: ${UAS_IDEMPOTENCY_HASH_KEY:-change-me-local-idempotency-hash-key-32-bytes}
      UAS_AUTH_SIGNING_KEY: ${UAS_AUTH_SIGNING_KEY:-change-me-local-auth-signing-key-32-bytes}
      UAS_AUTH_HASH_KEY: ${UAS_AUTH_HASH_KEY:-change-me-local-auth-hash-key-32-bytes}
      UAS_OAUTH_HASH_KEY: ${UAS_OAUTH_HASH_KEY:-change-me-local-oauth-hash-key-32-bytes}
      UAS_PROVIDER_ENCRYPTION_KEY: ${UAS_PROVIDER_ENCRYPTION_KEY:-change-me-local-provider-encryption-key-32-bytes}
      UAS_GOOGLE_OAUTH_ENABLED: ${UAS_GOOGLE_OAUTH_ENABLED:-false}
      UAS_GOOGLE_CLIENT_ID: ${UAS_GOOGLE_CLIENT_ID:-}
      UAS_GOOGLE_CLIENT_SECRET: ${UAS_GOOGLE_CLIENT_SECRET:-}
      UAS_GOOGLE_REDIRECT_URI: ${UAS_GOOGLE_REDIRECT_URI:-http://localhost:8000/v1/connections/google/callback}
      UAS_WEB_ORIGIN: ${UAS_WEB_ORIGIN:-http://localhost:3000}
      UAS_SMTP_HOST: ${UAS_SMTP_HOST:-mailpit}
      UAS_SMTP_PORT: ${UAS_SMTP_PORT:-1025}
      UAS_EMAIL_FROM: ${UAS_EMAIL_FROM:-Universal AI Search <no-reply@localhost>}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: ["universal-ai-search-worker", "--poll-interval", "1"]
    environment:
      UAS_ENVIRONMENT: ${UAS_ENVIRONMENT:-local}
      UAS_DATABASE_URL: ${UAS_DATABASE_URL:-postgresql+psycopg://uas:change-me-local@postgres:5432/uas}
      UAS_DATABASE_ROLE: ${UAS_DATABASE_ROLE:-app_api}
      UAS_CURSOR_SIGNING_KEY: ${UAS_CURSOR_SIGNING_KEY:-change-me-local-cursor-signing-key-32-bytes}
      UAS_IDEMPOTENCY_HASH_KEY: ${UAS_IDEMPOTENCY_HASH_KEY:-change-me-local-idempotency-hash-key-32-bytes}
      UAS_AUTH_SIGNING_KEY: ${UAS_AUTH_SIGNING_KEY:-change-me-local-auth-signing-key-32-bytes}
      UAS_AUTH_HASH_KEY: ${UAS_AUTH_HASH_KEY:-change-me-local-auth-hash-key-32-bytes}
      UAS_OAUTH_HASH_KEY: ${UAS_OAUTH_HASH_KEY:-change-me-local-oauth-hash-key-32-bytes}
      UAS_PROVIDER_ENCRYPTION_KEY: ${UAS_PROVIDER_ENCRYPTION_KEY:-change-me-local-provider-encryption-key-32-bytes}
      UAS_GOOGLE_OAUTH_ENABLED: ${UAS_GOOGLE_OAUTH_ENABLED:-false}
      UAS_GOOGLE_CLIENT_ID: ${UAS_GOOGLE_CLIENT_ID:-}
      UAS_GOOGLE_CLIENT_SECRET: ${UAS_GOOGLE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
  redis-data:
