name: universal-ai-search-database-test

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: uas_test
      POSTGRES_PASSWORD: database-test-only
      POSTGRES_DB: uas_test
    volumes:
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uas_test -d uas_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  database-test:
    build:
      context: .
      dockerfile: infrastructure/docker/database-test.Dockerfile
    environment:
      UAS_DATABASE_MIGRATION_URL: postgresql+psycopg://uas_test:database-test-only@postgres:5432/uas_test
      UAS_TEST_DATABASE_DSN: postgresql://uas_test:database-test-only@postgres:5432/uas_test
      UAS_TEST_ADMIN_DSN: postgresql://uas_test:database-test-only@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
