name: Upload storage verification
on:
  push:
    branches: [verify/desktop-upload-storage]
permissions:
  contents: read
concurrency:
  group: desktop-upload-storage-verification
  cancel-in-progress: true
jobs:
  minio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Test pinned disposable object storage
        run: bash scripts/verify-desktop-upload-storage.sh
